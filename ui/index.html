<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신경영상 DEVS 실험실</title>
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --band: rgba(11,11,11,.045);
  --accent: #2a78d6; --accent-ink: #ffffff; --accent-wash: #e8f1fc; --accent-track: #cde2fb;
  --good: #006300; --bad: #d03b3b; --warn: #fab219; --warn-ink: #0b0b0b; --serious: #ec835a;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --band:rgba(255,255,255,.05);
    --accent:#3987e5; --accent-wash:#16222f; --accent-track:#184f95;
    --good:#0ca30c; --bad:#e66767;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --band:rgba(255,255,255,.05);
  --accent:#3987e5; --accent-wash:#16222f; --accent-track:#184f95;
  --good:#0ca30c; --bad:#e66767;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select { font: inherit; color: inherit; }
h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); } .ink2 { color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }

/* header */
header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.hbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 18px; }
.hbar .title { display: flex; flex-direction: column; margin-right: 8px; }
.hbar .title small { color: var(--muted); font-size: 12px; }
.field { display: flex; align-items: center; gap: 6px; }
.field label { color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.ctl { height: 34px; padding: 0 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); min-width: 0; }
.ctl:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.ctl[type=number] { width: 64px; }
#runName { width: 190px; }
.btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--accent-wash); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 20px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.icon { width: 34px; padding: 0; }
.spacer { flex: 1; }
#progress { height: 3px; background: transparent; }
#progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#status { font-size: 12.5px; color: var(--ink2); min-width: 0; }

/* layout */
.layout { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 18px; padding: 18px; align-items: start; }
aside#side { position: sticky; top: 88px; max-height: calc(100vh - 106px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
@media (max-width: 1050px) { .layout { grid-template-columns: 1fr; } aside#side { position: static; max-height: none; overflow: visible; } .side-top { position: static; } header { position: static; } }
.side-top { padding: 12px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.side-top .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--accent-wash); color: var(--ink); border: 1px solid var(--border); white-space: nowrap; }
.crow { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; padding: 6px 12px 6px 11px; border-left: 3px solid transparent; border-top: 1px dashed var(--border); }
.crow.off { opacity: .5; }
.crow .nm { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.crow .tag { font-size: 11px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--axis); color: var(--ink2); }
.crow .tag.inc { color: var(--accent); border-color: var(--accent); }
.crow .sub2 { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.crow .am { display: flex; align-items: center; gap: 3px; }
.crow .am input { width: 118px; text-align: right; }
.crow .ib { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 4px; border-radius: 6px; font-size: 14px; }
.crow .ib:hover { background: var(--accent-wash); color: var(--ink); }
.cadd { display: flex; gap: 6px; padding: 8px 14px; flex-wrap: wrap; }
dialog#costDlg { border: 1px solid var(--axis); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(520px, 94vw); }
dialog#costDlg::backdrop { background: rgba(0,0,0,.35); }
#costDlg form { padding: 16px 18px; display: grid; gap: 10px; }
#costDlg label.f { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; }
#costDlg .seg { display: flex; gap: 6px; }
#costDlg .prev { background: var(--accent-wash); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; }
#costDlg .acts { display: flex; justify-content: flex-end; gap: 8px; }
details.grp { border-bottom: 1px solid var(--border); }
details.grp:last-child { border-bottom: 0; }
details.grp > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; display: inline-block; width: 10px; }
details.grp[open] > summary::before { transform: rotate(90deg); }
.badge { font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; min-width: 18px; text-align: center; }
.gdesc { padding: 0 14px 8px 32px; color: var(--muted); font-size: 12px; margin-top: -4px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 5px 14px 5px 11px; border-left: 3px solid transparent; }
.prow.changed { border-left-color: var(--accent); background: var(--accent-wash); }
.prow label { color: var(--ink); } .prow .unit { color: var(--muted); font-size: 12px; margin-left: 4px; }
.prow .in { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.prow input[type=number] { width: 76px; text-align: right; height: 30px; padding: 0 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); }
.prow input.bad, .gt input.bad { border-color: var(--bad); }
.prow .help { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; margin-top: -3px; }
.rst { visibility: hidden; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 14px; }
.changed .rst, .gt td.changed .rst { visibility: visible; }
table.gt { width: calc(100% - 22px); margin: 2px 11px 10px; border-collapse: collapse; font-size: 12.5px; }
.gt th { color: var(--muted); font-weight: 500; text-align: center; padding: 3px 2px; }
.gt td { padding: 2px; text-align: center; }
.gt td:first-child { text-align: left; color: var(--ink2); padding-left: 4px; white-space: nowrap; }
.gt input[type=number] { width: 100%; min-width: 0; height: 28px; text-align: center; padding: 0 2px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); }
.gt select { width: 100%; height: 28px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); padding: 0 2px; }
.gt td.changed input, .gt td.changed select { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }

/* main */
main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card > .ch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
.card > .ch .sub { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; height: 30px; cursor: pointer; color: var(--ink2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* load meters */
.loads { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 22px; }
.meter .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
.meter .bar { height: 8px; border-radius: 999px; background: var(--accent-track); overflow: hidden; margin: 4px 0 2px; }
.meter .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.meter.warn .bar i { background: var(--warn); } .meter.crit .bar i { background: var(--bad); }
.meter .tag { font-size: 11.5px; color: var(--ink2); } .meter.crit .tag { color: var(--bad); font-weight: 600; }

/* summary tiles */
.hero { display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: flex-end; margin-bottom: 16px; }
.hero .lab { color: var(--ink2); font-size: 13px; }
.hero .val { font-size: 52px; line-height: 1.05; font-weight: 650; letter-spacing: -.02em; }
.hero .val small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.tile .lab { color: var(--ink2); font-size: 12.5px; }
.tile .val { font-size: 24px; font-weight: 650; line-height: 1.2; }
.tile .val small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.sd { color: var(--muted); font-size: 12px; }
.delta { font-size: 12.5px; font-weight: 600; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.flat { color: var(--muted); font-weight: 500; }
.runtag { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.warnbox { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.empty { color: var(--muted); padding: 22px 6px; text-align: center; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11.5px; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .axis line { stroke: var(--axis); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.14); z-index: 5; min-width: 150px; white-space: nowrap; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .r b { margin-left: 14px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; }

/* runs list */
.runs { display: flex; flex-direction: column; gap: 8px; }
.run { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
.run.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.run .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.run .meta { color: var(--muted); font-size: 12px; }
.run .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 760px) { .run { grid-template-columns: auto 1fr; } .run .acts { grid-column: 1 / -1; justify-content: flex-start; } }
.tagb { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--axis); color: var(--ink2); font-weight: 500; }
.tagb.base { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tagb.bad { border-color: var(--bad); color: var(--bad); }

/* compare table */
.tscroll { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 10px; }
table.cmp { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.cmp th, .cmp td { padding: 6px 12px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
.cmp th:first-child, .cmp td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
.cmp thead th { position: sticky; top: 0; background: var(--surface); z-index: 3; vertical-align: bottom; }
.cmp thead th:first-child { z-index: 4; }
.cmp tr.gh td { background: var(--bg); color: var(--ink2); font-weight: 600; font-size: 12px; text-align: left; position: static; }
.cmp td .v { font-weight: 600; } .cmp td .d { font-size: 11.5px; }
.cmp td.basecol, .cmp th.basecol { background: var(--accent-wash); }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; max-width: 420px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13px; }
.toast.err { background: var(--bad); color: #fff; }
.kpisel { max-width: 320px; }

/* ? 도움말 */
.qm { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 5px; border: 1px solid var(--muted); border-radius: 50%; color: var(--muted); font-size: 10px; font-weight: 700; line-height: 1; cursor: help; vertical-align: middle; flex: none; user-select: none; font-style: normal; }
.qm:hover, .qm:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
#qmtip { position: fixed; z-index: 100; max-width: 320px; background: var(--ink); color: var(--bg); padding: 8px 11px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; white-space: pre-line; box-shadow: 0 6px 20px rgba(0,0,0,.25); pointer-events: none; display: none; font-weight: 400; }

/* 24시간 편집기 */
.ed-tabs { margin-bottom: 10px; }
.hgrid { overflow-x: auto; padding-bottom: 4px; }
table.hed { border-collapse: separate; border-spacing: 2px; font-size: 12px; width: 100%; min-width: 900px; table-layout: fixed; user-select: none; }
.hed th { color: var(--muted); font-weight: 500; text-align: center; padding: 0 0 2px; font-size: 11px; }
.hed th:first-child { width: 175px; }
.hed th:last-child { width: 28px; }
.hed td.rl { width: 175px; text-align: left; padding-right: 8px; white-space: nowrap; overflow: visible; }
.hed td.rl .nm { display: flex; align-items: center; gap: 2px; }
.hed td.rl .brush { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.hed td.rl .brush input[type=number], .hed td.rl .brush select { height: 26px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); padding: 0 4px; }
.hed td.rl .brush input[type=number] { width: 58px; text-align: right; }
.hed td.rl .brush .unit { color: var(--muted); font-size: 11.5px; }
.hed tr.changed td.rl .nm b { color: var(--accent); }
.hed td.cell { height: 34px; text-align: center; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); padding: 0; font-variant-numeric: tabular-nums; font-size: 11px; background: var(--surface); position: relative; overflow: hidden; }
.hed td.cell.diff { box-shadow: 0 0 0 2px var(--accent) inset; }
.hed td.cell:hover { outline: 2px solid var(--ink2); outline-offset: -1px; }
.hed td.rb { width: 28px; text-align: center; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.mini { display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; margin: 0 14px 8px 14px; cursor: pointer; }
.mini i { display: block; height: 14px; border-radius: 2px; background: var(--grid); }
.mini-row { padding: 2px 0 0; }
.mini-row .ml { display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; color: var(--ink2); }
.mini-row.changed .ml { color: var(--accent); font-weight: 600; }
.mini-row .ml a { margin-left: auto; font-size: 11.5px; color: var(--accent); cursor: pointer; text-decoration: none; }
.mini-row .ml a:hover { text-decoration: underline; }
.lstat { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
.lstat b { color: var(--ink); }
.minis { margin: 0 14px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.minis .mini { margin: 0; } .minis .mini i { height: 9px; }
.hed tr.sec td { padding: 10px 0 3px; }
.hed tr.sec .nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hed tr.sec.changed b { color: var(--accent); }
.hed .brush { display: inline-flex; align-items: center; gap: 4px; }
.hed .brush input[type=number], .hed .brush select { height: 26px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); padding: 0 4px; }
.hed .brush input[type=number] { width: 58px; text-align: right; }
.hed .brush .unit { color: var(--muted); font-size: 11.5px; }
.hed .rst.del { visibility: visible; font-size: 12px; margin-left: auto; }
.hed .rst.del:hover:not(:disabled) { color: var(--bad); }
.hed .rst.del:disabled { opacity: .3; cursor: not-allowed; }
.kpipick { position: relative; }
.kpipick > summary { list-style: none; cursor: pointer; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); }
.kpipick > summary::-webkit-details-marker { display: none; }
.kpipick[open] > summary { background: var(--accent-wash); }
.kpipanel { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); width: min(760px, 86vw); max-height: 360px; overflow: auto; }
.kpipanel .pre { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kpipanel .kg { margin-top: 8px; } .kpipanel .kgh { font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 2px; }
.kpipanel .kc { display: inline-flex; align-items: center; gap: 4px; margin: 2px 14px 2px 0; white-space: nowrap; }
.bk { margin-bottom: 16px; } .bk:last-child { margin-bottom: 0; }
.bt { display: flex; align-items: center; gap: 2px; margin-bottom: 2px; }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title"><h1>신경영상 DEVS 실험실</h1><small>CT·MRI 촬영–판독 시스템 · 조건을 바꿔 실행하고 비교</small></div>
    <div class="field"><label for="preset">프리셋</label><i class="qm" tabindex="0" data-tip="저장해 둔 조건 묶음. 고른 뒤 '적용'을 누르면 왼쪽 패널과 24시간 편집기 값이 바뀐다 (실행은 따로 ▶ 실행). 기본 프리셋은 명세에 나온 기준값·수요 비교 조건이고, 팀이 만든 조건은 '＋ 내 프리셋 저장'으로 추가한다.">?</i>
      <select id="preset" class="ctl" style="max-width:250px"></select>
      <button id="applyPreset" class="btn">적용</button>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (v, d = 1) => (v == null || Number.isNaN(v)) ? "–" : Number(v).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const STORE = "neuro_devs_lab_v3";            // v3: 명세 합친 버전 기본값으로 바뀌며 이전 저장값은 쓰지 않는다
const PSTORE = "neuro_devs_user_presets";      // 내 프리셋 (기본값과 별개로 저장)
const MAXRUNS = 8;
let schema, PARAMS, BYKEY = {}, KPIS = [], KBY = {}, DEFAULTS = {};
let values = {}, runs = [], selected = new Set(), baselineId = null, currentId = null;
let queueSel = "CT_QUEUE", qView = "profile", running = false, abortFlag = false;
let barKpis = ["total_mean"];

const QUEUES = [
  { id: "CT_QUEUE", label: "CT 촬영" }, { id: "MRI_QUEUE", label: "MRI 촬영" },
  { id: "FINAL_WORKLIST", label: "최종판독" }, { id: "PRELIM_WORKLIST", label: "가판독" },
];

/* ---------------------------------------------------------------- 저장 */
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ costUnit: "man", values, runs, selected: [...selected], baselineId, currentId, barKpis })); }
  catch (e) { toast("브라우저 저장 공간이 부족해 마지막 변경이 저장되지 않았습니다. 실험을 내보내기 후 정리하세요.", true); }
}
const toMan = x => (typeof x === "number" ? x / 10000 : x);
const itemsToMan = arr => Array.isArray(arr) ? arr.map(c => ({ ...c, amount: toMan(c.amount) })) : arr;
function migrateToMan(s) {            // 이전에는 금액을 원 단위로 저장했다 -> 만원
  if (s.costUnit === "man") return s;
  if (s.values && s.values.cost_items) s.values.cost_items = itemsToMan(s.values.cost_items);
  (s.runs || []).forEach(r => {
    if (r.values && r.values.cost_items) r.values.cost_items = itemsToMan(r.values.cost_items);
    ["net_day", "income_day", "expense_day"].forEach(k => { const o = r.kpi && r.kpi[k]; if (o) ["mean", "sd", "min", "max"].forEach(f => o[f] = toMan(o[f])); });
    if (r.costDetail) r.costDetail.forEach(c => c.per_day = toMan(c.per_day));
  });
  s.costUnit = "man"; return s;
}
function load() {
  try {
    let s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!s) return;
    s = migrateToMan(s);
    runs = s.runs || []; selected = new Set(s.selected || []); baselineId = s.baselineId; currentId = s.currentId;
    for (const k in (s.values || {})) if (k in BYKEY && validValue(BYKEY[k], s.values[k])) values[k] = s.values[k];
    if (Array.isArray(s.barKpis)) barKpis = s.barKpis.filter(k => k in KBY);
  } catch (e) { /* 무시 */ }
}
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toastHost").appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3500);
}

/* ---------------------------------------------------------------- 공통 도구 */
const QM = t => t ? `<i class="qm" tabindex="0" data-tip="${esc(t)}">?</i>` : "";
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const hh = h => String(h).padStart(2, "0");
const isChanged = k => !same(values[k], DEFAULTS[k]);
const changedKeys = () => PARAMS.filter(p => isChanged(p.key)).map(p => p.key);
const isHr = p => p.type === "hourly" || p.type === "rows";   // 0~23시 표 (hourly = 한 줄, rows = 자리를 추가·삭제하는 여러 줄)
const HOURLY = () => PARAMS.filter(isHr);
const rowsOf = k => BYKEY[k].type === "rows" ? values[k] : [values[k]];
const defRowsOf = k => BYKEY[k].type === "rows" ? DEFAULTS[k] : [DEFAULTS[k]];
const onCount = (rows, h) => rows.reduce((a, r) => a + (r[h] ? 1 : 0), 0);
function validValue(p, v) {
  if (p.type === "costs") return Array.isArray(v) && v.every(x => x && typeof x === "object" && x.id && x.basis);
  if (p.type === "hourly") return Array.isArray(v) && v.length === 24;
  if (p.type === "rows") return Array.isArray(v) && v.length >= p.min_rows && v.length <= p.max_rows && v.every(r => Array.isArray(r) && r.length === 24);
  return true;
}
const showScalar = v => v === true ? "켬" : v === false ? "끔" : v;
function runs24(arr) { // 같은 값이 이어지는 구간 [시작, 끝(미포함), 값]
  const out = [];
  arr.forEach((v, h) => { const l = out[out.length - 1]; if (l && same(l[2], v)) l[1] = h + 1; else out.push([h, h + 1, v]); });
  return out;
}
function showVal(v) {
  if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" && !Array.isArray(v[0]))
    return v.filter(c => c.enabled).map(c => `${c.type === "수입" ? "+" : "−"}${c.name} ${won(c.amount)}/${c.period}`).join(" · ") || "비용·수입 없음";
  if (Array.isArray(v) && Array.isArray(v[0])) return v.map((r, i) => `#${i + 1} ${showVal(r)}`).join(" / ");
  return Array.isArray(v) ? runs24(v).map(r => `${r[0]}~${r[1]}시 ${showScalar(r[2])}`).join(" · ") : showScalar(v);
}
function diffRanges(from, to) { // 기준과 다른 시간대를 같은 (기준값→새값) 끼리 묶어 문자열로
  const segs = [];
  for (let h = 0; h < 24; h++) {
    if (same(from[h], to[h])) continue;
    const l = segs[segs.length - 1];
    if (l && l.end === h && same(l.f, from[h]) && same(l.t, to[h])) l.end = h + 1; else segs.push({ start: h, end: h + 1, f: from[h], t: to[h] });
  }
  const txt = segs.slice(0, 2).map(g => `${g.start}~${g.end}시 ${showScalar(g.f)}→${showScalar(g.t)}`).join(", ");
  return txt + (segs.length > 2 ? ` 외 ${segs.length - 2}구간` : "");
}
function diffRows(from, to) {
  if (from.length !== to.length) return `${from.length}→${to.length}자리`;
  const parts = [];
  to.forEach((r, i) => { if (!same(r, from[i])) parts.push(`${i + 1}번 ${diffRanges(from[i], r)}`); });
  return parts.slice(0, 2).join(" · ") + (parts.length > 2 ? ` 외 ${parts.length - 2}자리` : "");
}
function shortLabel(k) { const p = BYKEY[k]; return isHr(p) ? p.short : (p.grid ? p.grid.row + " " + p.grid.col : p.label); }
function chipText(k, from, to) {
  const p = BYKEY[k];
  if (p.type === "costs") {
    const f = new Map(from[k].map(c => [c.id, c])), t = new Map(to[k].map(c => [c.id, c]));
    const add = [...t.keys()].filter(i => !f.has(i)).length, del = [...f.keys()].filter(i => !t.has(i)).length;
    const mod = [...t.keys()].filter(i => f.has(i) && !same(f.get(i), t.get(i))).length;
    return "비용·수입 " + [add && `+${add}`, del && `−${del}`, mod && `수정 ${mod}`].filter(Boolean).join(" ");
  }
  if (p.type === "rows") return `${p.short} ${diffRows(from[k], to[k])}`;
  return p.type === "hourly" ? `${p.short} ${diffRanges(from[k], to[k])}` : `${shortLabel(k)} ${showScalar(from[k])}→${showScalar(to[k])}`;
}
/* ? 도움말 툴팁 (한 개를 화면 맨 위에 띄워 스크롤 영역에 잘리지 않게) */
const tipEl = document.getElementById("qmtip");
function showQm(el) {
  tipEl.textContent = el.dataset.tip; tipEl.style.display = "block";
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, hgt = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tipEl.style.top = (r.bottom + 8 + hgt > innerHeight - 8 ? Math.max(8, r.top - hgt - 8) : r.bottom + 8) + "px";
}
const hideQm = () => { tipEl.style.display = "none"; };
document.addEventListener("mouseover", e => { const q = e.target.closest && e.target.closest(".qm"); if (q) showQm(q); });
document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest(".qm")) hideQm(); });
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("qm")) showQm(e.target); });
document.addEventListener("focusout", hideQm);
document.addEventListener("click", e => { const q = e.target.closest && e.target.closest(".qm"); if (q) { e.preventDefault(); e.stopPropagation(); showQm(q); } else hideQm(); }, true);
document.addEventListener("scroll", hideQm, true);

/* ---------------------------------------------------------------- 조건 패널 */
const CHOICE_BG = { "off": null, "CT": "var(--c1)", "MRI": "var(--c2)", "CT+MRI": "var(--c3)" };
const CHOICE_TXT = { "off": "–", "CT": "CT", "MRI": "MRI", "CT+MRI": "C+M" };
function cellLook(p, v) { // 시간대 칸의 배경·글자 (글자도 같이 써서 색만으로 구분하지 않는다)
  if (p.kind === "bool") return { bg: v ? "color-mix(in srgb, var(--accent) 45%, var(--surface))" : "var(--surface)", txt: v ? "●" : "–" };
  if (p.kind === "choice") { const c = CHOICE_BG[v]; return { bg: c ? `color-mix(in srgb, ${c} 50%, var(--surface))` : "var(--surface)", txt: CHOICE_TXT[v] }; }
  const vmax = Math.max(1, ...values[p.key], ...DEFAULTS[p.key]), a = Math.min(1, v / vmax);
  return { bg: v > 0 ? `color-mix(in srgb, var(--accent) ${Math.round(8 + a * 47)}%, var(--surface))` : "var(--surface)", txt: Number.isInteger(v) ? v : v.toFixed(1) };
}
function inputFor(p) {
  const id = "p_" + p.key;
  if (p.type === "bool") return `<input type="checkbox" id="${id}" data-k="${p.key}" ${values[p.key] ? "checked" : ""}>`;
  if (p.type === "choice")
    return `<select id="${id}" data-k="${p.key}">${p.options.map(o => `<option ${o === values[p.key] ? "selected" : ""}>${o}</option>`).join("")}</select>`;

function avgCost(results) {      // 항목별 일평균 금액 (시드 평균)

}
function aggregate(results) {
  const kpi = {};

    const vals = results.map(r => r.kpi[d.key]).filter(x => x != null);
    if (!vals.length) return;
    const n = vals.length, mean = vals.reduce((a, b) => a + b, 0) / n;
    const sd = n > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
    kpi[d.key] = { mean, sd, n, min: Math.min(...vals), max: Math.max(...vals) };
  });
  const avg = f => {
    const out = {}; const keys = Object.keys(f(results[0]));
    keys.forEach(q => { const L = f(results[0])[q].length; out[q] = Array.from({ length: L }, (_, i) => results.reduce((s, r) => s + f(r)[q][i], 0) / results.length); });
    return out;
  };

}

    toast(`“${name}” 완료 · 시드 ${run.n}개 · ${run.seconds}초` + (run.checks_ok ? "" : " · ⚠ 모델 검증 실패 항목 있음"), !run.checks_ok);
    $("#sumCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    toast("실행 실패: " + e.message, true);
  } finally {
    running = false; $("#run").disabled = false; $("#stop").style.display = "none";
    $("#progress > i").style.width = "0"; $("#status").textContent = "";
  }
}

/* ---------------------------------------------------------------- 델타 */
function deltaInfo(run, base, key) {
  const a = run.kpi[key], b = base && base.kpi[key];
  if (!a || !b || run.id === base.id) return null;
  const d = a.mean - b.mean, noise = Math.max(a.sd, b.sd);
  const better = KBY[key].better;
  const flat = Math.abs(d) < noise || Math.abs(d) < 1e-9;
  let cls = "flat";
  if (!flat && better) cls = ((d < 0) === (better === "lower")) ? "good" : "bad";
  return { d, cls, flat, pct: b.mean ? d / b.mean * 100 : null };
}
function deltaHtml(info, def) {
  if (!info) return "";
  const arrow = info.flat ? "≈" : info.d > 0 ? "▲" : "▼";
  const txt = `${info.d > 0 ? "+" : ""}${nf(info.d, def.decimals)}${def.unit === "%" ? "%p" : ""}`;
  return `<span class="delta ${info.cls}" title="${info.flat ? "차이가 시드 간 변동보다 작음" : ""}">${arrow} ${txt}${info.pct != null && def.unit !== "%" ? ` (${info.pct > 0 ? "+" : ""}${nf(info.pct, 0)}%)` : ""}</span>`;
}

/* ---------------------------------------------------------------- 요약 */
const TILES = ["scan_wait_ct", "scan_wait_mri", "final_wait_mean", "prelim_mean", "within24", "unfinished", "net_day"];
function renderSummary() {
  const card = $("#sumCard");
  const run = runs.find(r => r.id === currentId);
  if (!run) { card.innerHTML = `<div class="ch"><h2>결과 요약</h2></div><div class="empty">왼쪽에서 조건을 고르고 <b>▶ 실행</b>을 누르면 결과가 여기에 나옵니다.<br>먼저 기준값 그대로 한 번 실행해 두면, 이후 실험이 기준 대비 얼마나 달라졌는지 바로 보입니다.</div>`; return; }
  const base = runs.find(r => r.id === baselineId);
  const isBase = base && base.id === run.id;
  const diffKeys = PARAMS.filter(p => !same(run.values[p.key], DEFAULTS[p.key])).map(p => p.key);
  const hero = run.kpi.total_mean, hp = run.kpi.total_p95;
  let h = `<div class="ch"><h2>결과 요약</h2><span class="runtag"><i class="dot" style="background:var(--c${run.color + 1})"></i><b>${esc(run.name)}</b></span><span class="sub">시드 ${run.n}개 평균 ± 표준편차 · ${isBase ? "기준 실험" : base ? `기준 “${esc(base.name)}” 대비` : "기준 없음"}</span></div>`;
  if (!run.checks_ok) h += `<div class="warnbox">⚠ 모델 검증 실패: ${run.failed.map(esc).join(", ")} — 이 결과는 믿기 전에 확인이 필요합니다.</div>`;
  if (diffKeys.length) h += `<div class="chips" style="margin:-4px 0 12px">${diffKeys.slice(0, 10).map(k => `<span class="chip">${esc(chipText(k, DEFAULTS, run.values))}</span>`).join("")}${diffKeys.length > 10 ? `<span class="chip">+${diffKeys.length - 10}</span>` : ""}</div>`;
  h += `<div class="hero"><div><div class="lab">전체 소요 평균 (요청 → 최종보고)${QM(KBY.total_mean.help)}</div><div class="val num">${nf(hero.mean, 1)}<small>분</small></div><div class="sd">± ${nf(hero.sd, 1)} · 시드 범위 ${nf(hero.min, 1)}~${nf(hero.max, 1)}</div></div>
    <div><div class="lab">P95 (가장 늦은 5%의 경계)${QM(KBY.total_p95.help)}</div><div class="val num" style="font-size:30px">${nf(hp.mean, 1)}<small>분</small></div><div class="sd">± ${nf(hp.sd, 1)}</div></div>
    <div>${deltaHtml(deltaInfo(run, base, "total_mean"), KBY.total_mean)}<div>${deltaHtml(deltaInfo(run, base, "total_p95"), KBY.total_p95)}</div></div></div>`;
  h += `<div class="tiles">` + TILES.map(k => {
    const d = KBY[k], s = run.kpi[k];
    if (!s) return "";
    return `<div class="tile"><div class="lab">${d.label}${QM(d.help)}</div><div class="val num">${nf(s.mean, d.decimals)}<small>${d.unit}</small></div><div class="sd">± ${nf(s.sd, d.decimals)}</div><div>${deltaHtml(deltaInfo(run, base, k), d)}</div></div>`;
  }).join("") + `</div>`;
  if (run.costDetail && run.costDetail.length) {
    const rows = run.costDetail, inc = rows.filter(c => c.type === "수입"), exp = rows.filter(c => c.type === "지출");
    const sum = a => a.reduce((x, c) => x + c.per_day, 0);
    const tr = c => `<tr><td>${esc(c.name)}</td><td class="num" style="text-align:right">${man(c.per_day, 1)}</td></tr>`;
    h += `<details class="costsum" style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">비용·수입 내역 (일평균, 만원) ${QM("왼쪽 '비용·수입'에서 체크한 항목만 나옵니다. 시드 평균이며 단가는 가정값입니다.")}</summary>
      <table style="width:100%;margin-top:8px;border-collapse:collapse"><tbody>
      <tr><td colspan="2" class="muted">수입 ${man(sum(inc), 1)}만원</td></tr>${inc.map(tr).join("") || `<tr><td class="muted" colspan="2">체크된 수입 항목 없음</td></tr>`}
      <tr><td colspan="2" class="muted" style="padding-top:8px">지출 ${man(sum(exp), 1)}만원</td></tr>${exp.map(tr).join("") || `<tr><td class="muted" colspan="2">체크된 지출 항목 없음</td></tr>`}
      <tr><td><b>순이익</b></td><td class="num" style="text-align:right"><b>${man(sum(inc) - sum(exp), 1)}</b></td></tr></tbody></table></details>`;
  }
  card.innerHTML = h;
}

/* ---------------------------------------------------------------- 차트 공통 */
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
function showTip(host, html, x, y) {
  let t = host.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; host.appendChild(t); }
  t.innerHTML = html; t.style.display = "block";
  const w = t.offsetWidth, W = host.clientWidth;
  t.style.left = Math.max(0, Math.min(W - w, x + 14)) + "px"; t.style.top = Math.max(0, y - 10) + "px";
}
const hideTip = host => { const t = host.querySelector(".tip"); if (t) t.style.display = "none"; };
const selectedRuns = () => runs.filter(r => selected.has(r.id));
const col = r => `var(--c${r.color + 1})`;

/* ---------------------------------------------------------------- 대기열 차트 */
function renderQueue() {
  const host = $("#qChart"), rs = selectedRuns();
  $("#qSel").innerHTML = QUEUES.map(q => `<button data-q="${q.id}" aria-pressed="${q.id === queueSel}">${q.label}</button>`).join("");
  $("#qSel").querySelectorAll("button").forEach(b => b.onclick = () => { queueSel = b.dataset.q; renderQueue(); });
  $("#qView").querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.v === qView); b.onclick = () => { qView = b.dataset.v; renderQueue(); }; });
  if (!rs.length) { host.innerHTML = `<div class="empty">실험을 실행하면 시간대별 대기열이 여기에 나옵니다.</div>`; $("#qLegend").innerHTML = ""; return; }
  const prof = qView === "profile";
  const series = rs.map(r => ({ run: r, y: (prof ? r.profile24 : r.timeline)[queueSel] || [] }));
  const N = series[0].y.length, W = Math.max(320, host.clientWidth), H = 270, m = { l: 46, r: 14, t: 12, b: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ymax = niceMax(Math.max(0.1, ...series.flatMap(s => s.y)) * 1.08);
  const X = i => m.l + (N <= 1 ? 0 : i / (N - 1) * iw), Y = v => m.t + ih - v / ymax * ih;
  const fch = rs[0].first_clock_hour;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${QUEUES.find(q => q.id === queueSel).label} ${prof ? "시간대별 평균" : "타임라인"}">`;
  s += `<g class="grid">`; for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`; }
  s += `</g><g>`; for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; s += `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${nf(v, ymax < 5 ? 1 : 0)}</text>`; }
  s += `</g><g class="axis"><line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/></g>`;
  if (prof) for (let h = 0; h < 24; h += 3) s += `<text x="${X(h)}" y="${H - 10}" text-anchor="middle">${String(h).padStart(2, "0")}시</text>`;
  else { const st = rs[0].step || 1, ppd = 24 / st, days = Math.max(1, Math.round(N / ppd)), every = Math.max(1, Math.ceil(days / 8));
    for (let d = 0; d < days; d += every) s += `<text x="${X(d * ppd)}" y="${H - 10}" text-anchor="middle">${d + 1}일차</text>`; }
  series.forEach(se => {
    const d = se.y.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    s += `<path d="${d}" fill="none" style="stroke:${col(se.run)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  if (prof) series.forEach(se => { const i = N - 1; s += `<circle cx="${X(i)}" cy="${Y(se.y[i])}" r="4" style="fill:${col(se.run)};stroke:var(--surface)" stroke-width="2"/>`; });
  s += `<line id="qx" y1="${m.t}" y2="${m.t + ih}" style="stroke:var(--axis)" stroke-width="1" visibility="hidden"/><g id="qdots"></g>`;
  s += `<rect id="qhit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  host.innerHTML = s;
  const svg = host.querySelector("svg"), hit = $("#qhit"), qx = $("#qx"), dots = $("#qdots");
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(N - 1, Math.round((px - m.l) / iw * (N - 1))));
    qx.setAttribute("x1", X(i)); qx.setAttribute("x2", X(i)); qx.setAttribute("visibility", "visible");
    dots.innerHTML = series.map(se => `<circle cx="${X(i)}" cy="${Y(se.y[i])}" r="4" style="fill:${col(se.run)};stroke:var(--surface)" stroke-width="2"/>`).join("");
    const st = rs[0].step || 1, tt = i * st, hour = (fch + tt) % 24, title = prof ? `${String(i).padStart(2, "0")}시 ~ ${String(i + 1).padStart(2, "0")}시 (일평균)` : `${Math.floor(tt / 24) + 1}일차 ${hh(hour)}시${st > 1 ? ` ~ ${hh((hour + st) % 24)}시 (${st}시간 평균)` : ""}`;
    showTip(host, `<div class="t">${title}</div>` + series.map(se => `<div class="r"><span class="runtag"><i class="dot" style="background:${col(se.run)}"></i>${esc(se.run.name)}</span><b>${nf(se.y[i], 2)}건</b></div>`).join(""),
      (e.clientX - host.getBoundingClientRect().left), (e.clientY - host.getBoundingClientRect().top));
  });
  hit.addEventListener("mouseleave", () => { hideTip(host); qx.setAttribute("visibility", "hidden"); dots.innerHTML = ""; });
  $("#qLegend").innerHTML = rs.length > 1 ? rs.map(r => `<span><i style="background:${col(r)}"></i>${esc(r.name)}</span>`).join("") : "";
}

/* ---------------------------------------------------------------- 지표 비교 막대 (여러 지표를 체크해서) */
function renderKpiPick() {
  const groups = [...new Set(KPIS.map(d => d.group))];
  $("#kpiPanel").innerHTML = `<div class="pre"><span class="muted" style="font-size:12px">빠른 선택</span>
    <button class="btn sm" data-pre="core">핵심</button><button class="btn sm" data-pre="비용">비용·수입</button><button class="btn sm" data-pre="환자군">환자군 완료율</button><button class="btn sm" data-pre="그룹별">그룹별 소요</button><button class="btn sm" data-pre="자원">자원 점유율</button><button class="btn sm" data-pre="대기열">대기열</button><button class="btn sm" data-pre="clear">모두 해제</button></div>` +
    groups.map(g => `<div class="kg"><div class="kgh">${g}</div>${KPIS.filter(d => d.group === g).map(d => `<span class="kc"><label style="display:inline-flex;align-items:center;gap:4px"><input type="checkbox" data-kpi="${d.key}"> ${d.label} <span class="muted">(${d.unit})</span></label>${QM(d.help)}</span>`).join("")}</div>`).join("");
  const setBars = list => { barKpis = KPIS.map(d => d.key).filter(k => list.includes(k)); save(); renderBars(); };
  $("#kpiPanel").querySelectorAll("[data-kpi]").forEach(c => c.addEventListener("change", () => {
    const k = c.dataset.kpi; setBars(c.checked ? [...barKpis, k] : barKpis.filter(x => x !== k));
  }));
  $("#kpiPanel").querySelectorAll("[data-pre]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.pre; setBars(v === "clear" ? [] : v === "core" ? KPIS.filter(d => d.group === "핵심").map(d => d.key) : KPIS.filter(d => d.group === v).map(d => d.key));
  }));
}
function renderBars() {
  const host = $("#bList"), rs = selectedRuns();
  $("#kpiN").textContent = `(${barKpis.length}개 선택)`;
  document.querySelectorAll("#kpiPanel [data-kpi]").forEach(c => { c.checked = barKpis.includes(c.dataset.kpi); });
  $("#bSub").textContent = "";
  if (!rs.length) { host.innerHTML = `<div class="empty">실험을 실행하면 지표별 비교가 여기에 나옵니다.</div>`; return; }
  if (!barKpis.length) { host.innerHTML = `<div class="empty">보고 싶은 지표를 위의 <b>지표 고르기</b>에서 체크하세요.</div>`; return; }
  const picks = KPIS.filter(d => barKpis.includes(d.key) && rs.some(r => r.kpi[d.key]));
  const none = KPIS.filter(d => barKpis.includes(d.key) && !rs.some(r => r.kpi[d.key]));
  if (none.length) $("#bSub").textContent = `데이터 없는 지표(해당 자리가 없음): ${none.map(d => d.label).join(", ")}`;
  host.innerHTML = picks.map(d => `<div class="bk"><div class="bt"><b>${d.label}</b><span class="muted" style="margin-left:4px">(${d.unit})</span>${QM(d.help)}<span class="muted" style="margin-left:10px;font-size:12px">${d.better ? (d.better === "lower" ? "낮을수록 좋음" : "높을수록 좋음") : ""}</span></div><div class="chart" data-bk="${d.key}"></div></div>`).join("");
  picks.forEach(d => barChart(host.querySelector(`[data-bk="${d.key}"]`), d, rs));
}
function barChart(host, d, rs) {
  const W = Math.max(320, host.clientWidth), rowH = 32, m = { l: 190, r: 90, t: 6, b: 6 };
  const H = m.t + m.b + rs.length * rowH, iw = W - m.l - m.r;
  const hi = Math.max(1e-9, ...rs.map(r => r.kpi[d.key] ? r.kpi[d.key].mean + r.kpi[d.key].sd : 0));
  const xmax = niceMax(hi * 1.02), X = v => m.l + v / xmax * iw;
  const base = runs.find(r => r.id === baselineId);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${d.label} 실험별 비교">`;
  s += `<g class="grid">` + [0.25, 0.5, 0.75, 1].map(f => `<line x1="${X(xmax * f)}" x2="${X(xmax * f)}" y1="${m.t}" y2="${H - m.b}"/>`).join("") + `</g>`;
  s += `<g class="axis"><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/></g>`;
  rs.forEach((r, i) => {
    const k = r.kpi[d.key], y = m.t + i * rowH, bh = 18, by = y + (rowH - bh) / 2;
    const name = r.name.length > 22 ? r.name.slice(0, 21) + "…" : r.name;
    s += `<g class="brow" data-i="${i}"><rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent"/>`;
    s += `<text x="${m.l - 10}" y="${y + rowH / 2 + 4}" text-anchor="end" style="fill:var(--ink2)">${esc(name)}${base && base.id === r.id ? " · 기준" : ""}</text>`;
    if (k) {
      const w = Math.max(2, X(k.mean) - m.l), rr = Math.min(4, w);
      s += `<path d="M${m.l},${by}H${m.l + w - rr}Q${m.l + w},${by} ${m.l + w},${by + rr}V${by + bh - rr}Q${m.l + w},${by + bh} ${m.l + w - rr},${by + bh}H${m.l}Z" style="fill:${col(r)}"/>`;
      if (k.sd > 0) { const x1 = X(Math.max(0, k.mean - k.sd)), x2 = X(k.mean + k.sd), cy = by + bh / 2;
        s += `<g style="stroke:var(--ink2)" stroke-width="1.5"><line x1="${x1}" x2="${x2}" y1="${cy}" y2="${cy}"/><line x1="${x1}" x2="${x1}" y1="${cy - 5}" y2="${cy + 5}"/><line x1="${x2}" x2="${x2}" y1="${cy - 5}" y2="${cy + 5}"/></g>`; }
      s += `<text x="${X(k.mean + k.sd) + 8}" y="${y + rowH / 2 + 4}" style="fill:var(--ink);font-weight:600">${nf(k.mean, d.decimals)}</text>`;
    } else s += `<text x="${m.l + 8}" y="${y + rowH / 2 + 4}">데이터 없음</text>`;
    s += `</g>`;
  });
  host.innerHTML = s + `</svg>`;
  host.querySelectorAll(".brow").forEach(g => {
    const r = rs[+g.dataset.i], k = r.kpi[d.key];
    g.addEventListener("mousemove", e => {
      if (!k) return; const b = host.getBoundingClientRect();
      showTip(host, `<div class="t">${esc(r.name)}</div><div class="r"><span>${d.label}</span><b>${nf(k.mean, d.decimals)} ${d.unit}</b></div><div class="r"><span>표준편차</span><b>${nf(k.sd, d.decimals)}</b></div><div class="r"><span>시드 범위</span><b>${nf(k.min, d.decimals)} ~ ${nf(k.max, d.decimals)}</b></div><div class="r"><span>시드 수</span><b>${k.n}</b></div>`, e.clientX - b.left, e.clientY - b.top);
    });
    g.addEventListener("mouseleave", () => hideTip(host));
  });
}

/* ---------------------------------------------------------------- 실험 목록 */
function renderRuns() {
  const host = $("#runs");
  if (!runs.length) { host.innerHTML = `<div class="empty">아직 실행한 실험이 없습니다.</div>`; return; }
  host.innerHTML = runs.map(r => {
    const diff = PARAMS.filter(p => !same(r.values[p.key], DEFAULTS[p.key])).map(p => p.key);
    const chips = diff.length ? diff.slice(0, 6).map(k => `<span class="chip">${esc(chipText(k, DEFAULTS, r.values))}</span>`).join("") + (diff.length > 6 ? `<span class="chip">+${diff.length - 6}</span>` : "") : `<span class="chip">기준값 그대로</span>`;
    return `<div class="run ${r.id === currentId ? "current" : ""}" data-id="${r.id}">
      <input type="checkbox" ${selected.has(r.id) ? "checked" : ""} data-act="sel" aria-label="${esc(r.name)} 포함">
      <div><div class="nm"><i class="dot" style="background:var(--c${r.color + 1})"></i>${esc(r.name)}
        ${r.id === baselineId ? `<span class="tagb base">기준</span>` : ""}
        ${r.checks_ok ? `<span class="tagb">검증 ✓</span>` : `<span class="tagb bad" title="${esc(r.failed.join(", "))}">검증 ✗</span>`}</div>
        <div class="chips" style="margin:4px 0 2px">${chips}</div>
        <div class="meta">시드 ${r.n}개 (${r.seeds[0]}~) · ${new Date(r.createdAt).toLocaleString("ko-KR")} · ${r.seconds}초</div></div>
      <div class="acts"><button class="btn sm" data-act="view">결과 보기</button><button class="btn sm" data-act="load" title="이 실험의 조건을 왼쪽 패널에 불러오기">조건 불러오기</button>
        ${r.id === baselineId ? "" : `<button class="btn sm" data-act="base">기준으로</button>`}<button class="btn sm" data-act="name">이름</button><button class="btn sm" data-act="del">삭제</button></div></div>`;
  }).join("");
  host.querySelectorAll(".run").forEach(row => row.addEventListener("click", e => {
    const act = e.target.dataset.act; if (!act) return;
    const r = runs.find(x => x.id === row.dataset.id);
    if (act === "sel") { e.target.checked ? selected.add(r.id) : selected.delete(r.id); }
    else if (act === "view") currentId = r.id;
    else if (act === "load") { values = { ...DEFAULTS, ...r.values }; replaced(); toast(`“${r.name}” 조건을 불러왔습니다.`); }
    else if (act === "base") baselineId = r.id;
    else if (act === "name") { const n = prompt("실험 이름", r.name); if (n && n.trim()) r.name = n.trim(); }
    else if (act === "del") { if (!confirm(`“${r.name}”을(를) 삭제할까요?`)) return; runs = runs.filter(x => x.id !== r.id); selected.delete(r.id); if (baselineId === r.id) baselineId = runs[0] ? runs[0].id : null; if (currentId === r.id) currentId = runs.length ? runs[runs.length - 1].id : null; }
    save(); renderAll();
  }));
}

/* ---------------------------------------------------------------- 비교표 */
function renderTable() {
  const rs = selectedRuns(), tbl = $("#cmp"), base = runs.find(r => r.id === baselineId);
  if (!rs.length) { tbl.innerHTML = `<tbody><tr><td class="empty" style="text-align:center">실험을 실행하면 비교표가 여기에 나옵니다.</td></tr></tbody>`; return; }
  let h = `<thead><tr><th>지표</th>${rs.map(r => `<th class="${base && base.id === r.id ? "basecol" : ""}"><span class="runtag"><i class="dot" style="background:${col(r)}"></i>${esc(r.name)}</span>${base && base.id === r.id ? `<div class="muted" style="font-weight:500;font-size:11px">기준</div>` : ""}</th>`).join("")}</tr></thead><tbody>`;
  let lastG = null;
  KPIS.forEach(d => {
    if (!rs.some(r => r.kpi[d.key])) return;
    if (d.group !== lastG) { h += `<tr class="gh"><td colspan="${rs.length + 1}">${d.group}</td></tr>`; lastG = d.group; }
    h += `<tr><td>${d.label}${QM(d.help)} <span class="muted">(${d.unit})</span></td>` + rs.map(r => {
      const k = r.kpi[d.key], isB = base && base.id === r.id;
      if (!k) return `<td class="${isB ? "basecol" : ""}">–</td>`;
      return `<td class="num ${isB ? "basecol" : ""}"><div><span class="v">${nf(k.mean, d.decimals)}</span> <span class="sd">± ${nf(k.sd, d.decimals)}</span></div><div class="d">${deltaHtml(deltaInfo(r, base, d.key), d)}</div></td>`;
    }).join("") + `</tr>`;
  });
  tbl.innerHTML = h + `</tbody>`;
}

/* ---------------------------------------------------------------- 내보내기 */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCsv() {
  const rs = selectedRuns(); if (!rs.length) return toast("내보낼 실험이 없습니다.", true);
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [["그룹", "지표", "단위", ...rs.flatMap(r => [r.name + " 평균", r.name + " 표준편차"])]];
  KPIS.forEach(d => { if (rs.some(r => r.kpi[d.key])) rows.push([d.group, d.label, d.unit, ...rs.flatMap(r => r.kpi[d.key] ? [r.kpi[d.key].mean.toFixed(3), r.kpi[d.key].sd.toFixed(3)] : ["", ""])]); });
  rows.push([]); rows.push(["조건(기본값과 다른 것만)"]);
  PARAMS.forEach(p => { if (rs.some(r => !same(r.values[p.key], DEFAULTS[p.key]))) rows.push(["조건", shortLabel(p.key), "", ...rs.flatMap(r => [showVal(r.values[p.key]), ""])]); });
  download("neuro_devs_비교표.csv", "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n"), "text/csv");
}
function exportJson() { if (!runs.length) return toast("내보낼 실험이 없습니다.", true); download("neuro_devs_실험.json", JSON.stringify({ app: "neuro_devs_lab", version: 1, runs }, null, 1), "application/json"); }
function importJson(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result); if (j.app !== "neuro_devs_lab" || !Array.isArray(j.runs)) throw new Error("이 앱에서 내보낸 파일이 아닙니다");
      let added = 0;
      for (const r of j.runs) {
        if (runs.length >= MAXRUNS) { toast(`최대 ${MAXRUNS}개라 일부만 가져왔습니다.`, true); break; }
        if (!r.kpi || !r.values) continue;
        const used = new Set(runs.map(x => x.color)); let c = 0; while (used.has(c)) c++;
        r.id = "r" + Date.now().toString(36) + added; r.color = c; runs.push(r); selected.add(r.id); added++;
      }
      if (!baselineId && runs[0]) baselineId = runs[0].id; if (added) currentId = runs[runs.length - 1].id;
      save(); renderAll(); toast(`${added}개 실험을 가져왔습니다.`);
    } catch (e) { toast("가져오기 실패: " + e.message, true); }
  };
  fr.readAsText(file);
}

/* ---------------------------------------------------------------- 초기화 */
function renderAll() { renderLoads(); renderSummary(); renderQueue(); renderRuns(); renderBars(); renderTable(); }
async function init() {
  schema = await (await fetch("/api/schema")).json();
  PARAMS = schema.params; KPIS = schema.kpis;
  PARAMS.forEach(p => { BYKEY[p.key] = p; DEFAULTS[p.key] = p.default; }); KPIS.forEach(k => KBY[k.key] = k);
  values = { ...DEFAULTS }; load();
  runs = runs.filter(r => r && r.kpi && r.values);
  runs.forEach(r => { r.values = { ...DEFAULTS, ...r.values }; });   // 새로 생긴 조건 항목이 없는 예전 실험도 열리게 selected = new Set([...selected].filter(id => runs.some(r => r.id === id)));
  if (!runs.some(r => r.id === baselineId)) baselineId = runs[0] ? runs[0].id : null;
  if (!runs.some(r => r.id === currentId)) currentId = runs.length ? runs[runs.length - 1].id : null;
  loadUserPresets(); renderPresetSelect();
  $("#preset").onchange = syncPresetUi;
  $("#applyPreset").onclick = () => { const p = allPresets()[$("#preset").value]; values = { ...DEFAULTS, ...JSON.parse(JSON.stringify(p.values)) }; replaced(); toast(`“${p.name}” 조건을 적용했습니다. ${p.desc || ""}`); };
  $("#savePreset").onclick = savePresetNow; $("#delPreset").onclick = deletePresetNow;
  $("#run").onclick = runExperiment; $("#stop").onclick = () => { abortFlag = true; };
  $("#edReset").onclick = () => { HOURLY().filter(p => p.group === edTab).forEach(p => values[p.key] = DEFAULTS[p.key]); renderMini(); renderEditor(); afterParamChange(); };
  $("#exCsv").onclick = exportCsv; $("#exJson").onclick = exportJson;
  $("#imJson").onclick = () => $("#imFile").click(); $("#imFile").onchange = e => { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ""; };
  $("#clearAll").onclick = () => { if (runs.length && confirm("저장된 실험을 모두 삭제할까요?")) { runs = []; selected.clear(); baselineId = currentId = null; save(); renderAll(); } };
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; renderAll();
  };
  renderSide(); renderEditor(); renderKpiPick(); renderAll();
  let t; new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => { renderLoads(); renderQueue(); renderBars(); }, 120); }).observe(document.querySelector("main"));
}
init().catch(e => { document.body.insertAdjacentHTML("afterbegin", `<div class="warnbox" style="margin:18px">서버에 연결하지 못했습니다: ${esc(e.message)}<br>python app.py 로 서버를 켠 뒤 이 주소로 다시 여세요.</div>`); });
</script>
</body>
